<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - PIT II</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="header">
        <h1>Sistema de Gestão de Estoque</h1>
        <p>Projeto Integrador Transdisciplinar II — Sistemas de Informação</p>
    </header>

    <main class="container">
        <!-- Card do Formulário de Cadastro -->
        <section class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-produto">
                <div class="form-group">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico RGB">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria *</label>
                    <input type="text" id="categoria" required placeholder="Ex: Periféricos">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" id="preco" step="0.01" min="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="quantidade">Quantidade em Estoque *</label>
                        <input type="number" id="quantidade" min="0" required placeholder="0">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Salvar Produto</button>
            </form>
        </section>

        <!-- Card da Tabela de Listagem e Filtro -->
        <section class="card">
            <div class="table-header">
                <h2>Itens Cadastrados</h2>
                <input type="text" id="input-busca" placeholder="🔍 Buscar produto por nome..." class="search-input">
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Qtd</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    <!-- Preenchido dinamicamente via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
